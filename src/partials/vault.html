<div class="vault" data-vault>
  <div class="vault-output">
    <p class="secret" data-secret aria-live="polite" aria-label="{{vaultLabel}}"></p>
  </div>
  <div class="vault-actions">
    <button class="btn btn-primary" type="button" data-copy>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      <span data-label>{{copyLabel}}</span>
    </button>
    <button class="btn btn-secondary" type="button" data-regenerate>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      <span data-new-label>{{newLabel}}</span>
    </button>
  </div>
  <div class="vault-meter">
    <span class="rating" data-rating></span>
    <span class="meter-detail" data-meter-detail></span>
  </div>
  <div class="meter-bar" data-meter-bar><span></span></div>
</div>
